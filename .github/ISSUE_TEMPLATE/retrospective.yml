name: "Post-Game Jam Retrospective"
description: "Submit feedback on what went well and what we can improve for next time."
title: "[Retro] "
labels: ["retrospective"]
body:
  - type: input
    id: role
    attributes:
      label: Primary Role / Focus Area
      placeholder: "e.g., Gameplay Programmer, Sound Design, Art"
    validations:
      required: true

  - type: dropdown
    id: experience_rating
    attributes:
      label: Overall Jam Experience
      options:
        - "5 - Awesome"
        - "4 - Good"
        - "3 - Neutral"
        - "2 - Crunchy"
        - "1 - Frustrating"
    validations:
      required: true

  - type: dropdown
    id: scope_rating
    attributes:
      label: Scope & Time Management
      options:
        - "5 - Smooth"
        - "4 - Manageable"
        - "3 - Tight"
        - "2 - Crunchy"
        - "1 - Over-scoped"

  - type: textarea
    id: went_well
    attributes:
      label: What Went Well?
      description: Key wins, smooth workflows, and tools that worked cleanly.
      placeholder: "e.g., Godot's animation tree saved a lot of time, scope was well-defined..."
    validations:
      required: true

  - type: textarea
    id: needs_improvement
    attributes:
      label: What Needs Improvement?
      description: Roadblocks, unexpected hurdles, or process friction.
      placeholder: "e.g., Asset integration took longer than planned, merge conflicts on day 2..."
    validations:
      required: true

  - type: textarea
    id: action_items
    attributes:
      label: Actionable Ideas for Next Jam
      description: What specific changes, templates, or pipeline tweaks should we try next time?
      placeholder: "e.g., Prepare a base character controller template ahead of time..."
