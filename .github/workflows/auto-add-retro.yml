name: Auto Add Retrospectives to Project

on:
  issues:
    types: [opened, labeled]

jobs:
  add-to-project:
    name: Add issue to studio project
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'retrospective')
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v0.5.0
        with:
          # Replace with your Organization Project Board URL:
          project-url: https://github.com/orgs/Cosmic-Couch-Studios/projects/6
          github-token: ${{ secrets.GITHUB_TOKEN }}
